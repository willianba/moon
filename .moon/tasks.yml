$schema: 'https://moonrepo.dev/schemas/tasks.json'

fileGroups:
  sources:
    - 'src/**/*'
    - 'tests/**/*'
  configs:
    - '*.config.*'
    - 'tsconfig.json'
    - 'tsconfig.*.json'

tasks:
  # Biome lint + format (combined for speed)
  lint:
    command: 'bunx biome check --write .'
    inputs:
      - '@group(sources)'
      - '@group(configs)'
      - '/biome.json'
    options:
      runInCI: true

  # Biome format only
  format:
    command: 'bunx biome format --write .'
    inputs:
      - '@group(sources)'
      - '@group(configs)'
      - '/biome.json'

  # Biome check (no writes, for CI)
  lint-ci:
    command: 'bunx biome ci .'
    inputs:
      - '@group(sources)'
      - '@group(configs)'
      - '/biome.json'
    options:
      runInCI: true

  # TypeScript type checking
  typecheck:
    command: 'bunx tsc --noEmit --pretty'
    inputs:
      - '@group(sources)'
      - 'types/**/*'
      - 'tsconfig.json'
      - 'tsconfig.*.json'
      - '/tsconfig.options.json'
    options:
      runInCI: true
