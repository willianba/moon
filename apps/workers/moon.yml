layer: "application"
language: "typescript"
stack: "backend"

project:
  title: "workers"
  description: "Background job workers with BullMQ"

tasks:
  dev:
    command: "bun --watch run src/worker.ts"
    preset: server
    options:
      envFile: "/.env"

  start:
    command: "bun run src/worker.ts"
    preset: server
    options:
      envFile: "/.env"
