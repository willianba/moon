type: 'application'
language: 'typescript'
stack: 'backend'

project:
  name: 'workers'
  description: 'Background job workers with BullMQ'

tasks:
  dev:
    command: 'bun --watch run src/worker.ts'
    local: true
    options:
      envFile: '/.env'

  start:
    command: 'bun run src/worker.ts'
    local: true
    options:
      envFile: '/.env'
